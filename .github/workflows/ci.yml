name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  backend:
    name: Backend — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # npm ci: instala exactamente las versiones del lock (reproducible)
      - name: Instalar dependencias
        run: npm ci

      # Los mismos tests, generando además el informe de cobertura (backend/coverage/lcov.info)
      - name: Ejecutar tests con cobertura
        run: npm run test:coverage

      # Cada job corre en una máquina distinta: el informe se guarda como artefacto para el job de SonarQube
      - name: Guardar el informe de cobertura
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend
          path: backend/coverage/lcov.info
          retention-days: 7

      # Vulnerabilidades en las librerías de producción (incluidas las transitivas). Solo avisa
      - name: Auditoría de dependencias (npm audit)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # Análisis estático del código (bugs, vulnerabilidades, hotspots, code smells, duplicación) y cobertura
  sonarqube:
    name: SonarQube — Calidad del código
    needs: [ backend ]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      # Todo el historial: SonarQube lo necesita para saber qué líneas son nuevas en cada PR
      - name: Checkout del código (historial completo)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Recoger el informe de cobertura del backend
        uses: actions/download-artifact@v8
        with:
          name: cobertura-backend
          path: backend/coverage

      # Los PRs de Dependabot no tienen acceso a los secretos: sin token, el análisis se salta en lugar de fallar
      - name: Analizar con SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8

  frontend:
    name: Frontend — Build de producción
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar en modo producción
        run: npx ng build --configuration production

      # Comprueba que el código sigue el estilo de .prettierrc (no cambia nada). Solo avisa
      - name: Formato del código (Prettier)
        continue-on-error: true
        run: npm run format:check

      # Vulnerabilidades en las librerías de producción (incluidas las transitivas). Solo avisa
      - name: Auditoría de dependencias (npm audit)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # Dependencias, archivos y exportaciones sin usar en las tres partes del proyecto (configuración en knip.jsonc)
  librerias:
    name: Librerías no usadas (knip)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # knip necesita las dependencias instaladas para saber qué se usa
      - name: Instalar dependencias (raíz, backend y frontend)
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      # Solo avisa: el informe aparece en el log de este paso
      - name: Buscar librerías y código sin usar
        continue-on-error: true
        run: npx knip --no-progress

  # Solo si backend y frontend están bien: construye las imágenes Docker y las escanea con Trivy.
  # En los pull requests solo construye y escanea; al fusionar en main, además las publica en ghcr.io
  docker:
    name: Docker — ${{ matrix.servicio }}
    needs: [ backend, frontend ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # para subir los resultados de Trivy a la pestaña Security
    strategy:
      matrix:
        servicio: [ backend, frontend ]
    env:
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en GitHub Container Registry
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Etiquetas: "latest" (solo en main) y el SHA del commit, para saber qué código lleva cada imagen
      - name: Calcular nombre y etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pia-${{ matrix.servicio }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # La imagen se construye primero en la máquina del CI (load) para que Trivy pueda revisarla por dentro.
      # pull: descarga siempre la versión más reciente de la imagen base (con sus últimos parches)
      - name: Construir la imagen para escanearla
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.servicio }}
          pull: true
          load: true
          push: false
          tags: pia-${{ matrix.servicio }}:escaneo
          cache-from: type=gha,scope=${{ matrix.servicio }}

      # Trivy revisa TODA la imagen: librerías de npm, sistema operativo (Alpine) y runtime (Node o nginx).
      # Solo gravedad alta o crítica con arreglo disponible. Solo avisa (exit-code 0)
      - name: Escanear la imagen con Trivy (tabla en el log)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pia-${{ matrix.servicio }}:escaneo
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Escanear la imagen con Trivy (informe SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pia-${{ matrix.servicio }}:escaneo
          format: sarif
          output: trivy-${{ matrix.servicio }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          skip-setup-trivy: true   # Trivy ya está instalado por el paso anterior

      # El informe aparece en GitHub → Security → Code scanning
      - name: Subir los resultados a la pestaña Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.servicio }}.sarif
          category: imagen-${{ matrix.servicio }}

      - name: Construir (y publicar en main)
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.servicio }}
          pull: true
          push: ${{ env.PUBLICAR == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  # Solo en main y si todo lo anterior va bien: semantic-release calcula la versión a partir de los
  # commits (feat → minor, fix → patch), crea la etiqueta vX.Y.Z y la Release con la lista de cambios.
  # Después "promociona" a esa versión las mismas imágenes que ya pasaron los tests y Trivy (sin reconstruirlas)
  release:
    name: Versión (semantic-release)
    needs: [ backend, frontend, librerias, docker ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.tag }}
    # Nunca dos versiones a la vez (por ejemplo, si se fusionan dos PRs seguidos)
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write        # crear la etiqueta y la Release
      issues: write
      pull-requests: write
      packages: write        # añadir la etiqueta de versión a las imágenes

    steps:
      # Todo el historial y las etiquetas: semantic-release busca la última versión y los commits desde entonces
      - name: Checkout del código (historial completo)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Calcular la versión y publicar la Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      # semantic-release deja la etiqueta en el commit si ha creado versión
      - name: Comprobar si hay versión nueva
        id: version
        run: |
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then echo "Nueva versión: $TAG"; else echo "Sin versión nueva: solo cambios internos (chore, ci, refactor...)"; fi

      - name: Iniciar sesión en GitHub Container Registry
        if: steps.version.outputs.tag != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Añade las etiquetas X.Y.Z y X.Y a la imagen sha-<commit> que publicó el job docker
      - name: Promocionar las imágenes a la versión
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          VERSION="${TAG#v}"
          MENOR="${VERSION%.*}"
          ORIGEN="sha-${GITHUB_SHA::7}"
          for SERVICIO in backend frontend; do
            IMAGEN="ghcr.io/$OWNER/pia-$SERVICIO"
            docker buildx imagetools create -t "$IMAGEN:$VERSION" -t "$IMAGEN:$MENOR" "$IMAGEN:$ORIGEN"
            echo "$IMAGEN:$ORIGEN → $VERSION y $MENOR"
          done

  deploy:
    name: Despliegue a producción
    needs: [ release ]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://piamanager.vercel.app
    concurrency:
      group: despliegue
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Preparar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Desplegar el backend
        env:
          TAG: ${{ needs.release.outputs.version }}
          DESTINO: ${{ vars.SERVIDOR_USUARIO }}@${{ vars.SERVIDOR_IP }}
        run: |
          VERSION="${TAG#v}"
          ssh "$DESTINO" "cd /opt/piamanager \
            && sed -i 's/^VERSION=.*/VERSION=$VERSION/' .env \
            && docker compose -f docker-compose.prod.yml --env-file .env pull backend \
            && docker compose -f docker-compose.prod.yml --env-file .env up -d --wait \
            && docker image prune -f"

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Desplegar el frontend en Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@65.9.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Comprobar que la demo responde
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://piamanager.vercel.app/api/health

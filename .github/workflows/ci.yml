name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  backend:
    name: Backend — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # npm ci: instala exactamente las versiones del lock (reproducible)
      - name: Instalar dependencias
        run: npm ci

      # Los mismos tests, generando además el informe de cobertura (backend/coverage/lcov.info)
      - name: Ejecutar tests con cobertura
        run: npm run test:coverage

      # Cada job corre en una máquina distinta: el informe se guarda como artefacto para el job de SonarQube
      - name: Guardar el informe de cobertura
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend
          path: backend/coverage/lcov.info
          retention-days: 7

      # Vulnerabilidades en las librerías de producción (incluidas las transitivas). Solo avisa
      - name: Auditoría de dependencias (npm audit)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # Análisis estático del código (bugs, vulnerabilidades, hotspots, code smells, duplicación) y cobertura
  sonarqube:
    name: SonarQube — Calidad del código
    needs: [ backend ]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      # Todo el historial: SonarQube lo necesita para saber qué líneas son nuevas en cada PR
      - name: Checkout del código (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recoger el informe de cobertura del backend
        uses: actions/download-artifact@v8
        with:
          name: cobertura-backend
          path: backend/coverage

      # Los PRs de Dependabot no tienen acceso a los secretos: sin token, el análisis se salta en lugar de fallar
      - name: Analizar con SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8

  frontend:
    name: Frontend — Build de producción
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar en modo producción
        run: npx ng build --configuration production

      # Comprueba que el código sigue el estilo de .prettierrc (no cambia nada). Solo avisa
      - name: Formato del código (Prettier)
        continue-on-error: true
        run: npm run format:check

      # Vulnerabilidades en las librerías de producción (incluidas las transitivas). Solo avisa
      - name: Auditoría de dependencias (npm audit)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # Dependencias, archivos y exportaciones sin usar en las tres partes del proyecto (configuración en knip.jsonc)
  librerias:
    name: Librerías no usadas (knip)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # knip necesita las dependencias instaladas para saber qué se usa
      - name: Instalar dependencias (raíz, backend y frontend)
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      # Solo avisa: el informe aparece en el log de este paso
      - name: Buscar librerías y código sin usar
        continue-on-error: true
        run: npx knip --no-progress

  # Solo si backend y frontend están bien: construye las imágenes Docker y las escanea con Trivy.
  # En los pull requests solo construye y escanea; al fusionar en main, además las publica en ghcr.io
  docker:
    name: Docker — ${{ matrix.servicio }}
    needs: [ backend, frontend ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # para subir los resultados de Trivy a la pestaña Security
    strategy:
      matrix:
        servicio: [ backend, frontend ]
    env:
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Etiquetas: "latest" (solo en main) y el SHA del commit, para saber qué código lleva cada imagen
      - name: Calcular nombre y etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pia-${{ matrix.servicio }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # La imagen se construye primero en la máquina del CI (load) para que Trivy pueda revisarla por dentro
      - name: Construir la imagen para escanearla
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servicio }}
          load: true
          push: false
          tags: pia-${{ matrix.servicio }}:escaneo
          cache-from: type=gha,scope=${{ matrix.servicio }}

      # Trivy revisa TODA la imagen: librerías de npm, sistema operativo (Alpine) y runtime (Node o nginx).
      # Solo gravedad alta o crítica con arreglo disponible. Solo avisa (exit-code 0)
      - name: Escanear la imagen con Trivy (tabla en el log)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pia-${{ matrix.servicio }}:escaneo
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Escanear la imagen con Trivy (informe SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pia-${{ matrix.servicio }}:escaneo
          format: sarif
          output: trivy-${{ matrix.servicio }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          skip-setup-trivy: true   # Trivy ya está instalado por el paso anterior

      # El informe aparece en GitHub → Security → Code scanning
      - name: Subir los resultados a la pestaña Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.servicio }}.sarif
          category: imagen-${{ matrix.servicio }}

      - name: Construir (y publicar en main)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servicio }}
          push: ${{ env.PUBLICAR == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

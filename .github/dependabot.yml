# Dependabot: vigila cada semana las dependencias y abre PRs para actualizarlas.
# Cada PR pasa por el CI completo (tests, build, npm audit, Trivy, SonarQube, knip).
#
# Mensajes de commit con formato Conventional Commits, para el versionado automático:
#   fix(deps)       → librerías de producción: es un arreglo de la app (versión de parche)
#   chore(deps-dev) → librerías de desarrollo: no cambian la app (sin versión nueva)
#   fix(docker)     → imágenes base de Docker: suelen traer parches de seguridad
#   ci              → acciones de GitHub: solo cambian el proceso del CI

version: 2
updates:

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # Todas las actualizaciones compatibles (minor y patch) en un único PR por semana
      backend-menores:
        update-types: [minor, patch]
    ignore:
      # TypeScript mayor (p. ej. 7, compilador reescrito): rompe ts-node y Jest; se prueba a mano
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      frontend-menores:
        update-types: [minor, patch]
    ignore:
      # Las versiones mayores de Angular se actualizan a mano con "ng update"
      - dependency-name: "@angular/*"
        update-types: [version-update:semver-major]
      # Cada versión de Angular exige una versión concreta de TypeScript (Angular 21 → TypeScript 5.9):
      # TypeScript sube junto con Angular, con "ng update"
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # @angular/build 21 solo admite Vitest 4; jsdom va con Vitest. Suben junto con Angular
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: jsdom
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      raiz-menores:
        update-types: [minor, patch]
    ignore:
      # La versión 10 del preset necesita conventional-changelog-writer 9, y semantic-release 25 usa
      # la 8: con la 10 deja de generar las notas de la Release. Sube junto con semantic-release
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: [version-update:semver-major]

  # Imágenes base: node:24-alpine (backend) y nginx-unprivileged (frontend)
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    ignore:
      # Node se mantiene en la versión LTS (24), la misma del CI y de desarrollo; el salto de LTS se
      # hace a mano en todo el proyecto a la vez. Sí llegan los parches de la imagen node:24-alpine
      - dependency-name: node
        update-types: [version-update:semver-major]

  # Acciones del CI: checkout, setup-node, build-push-action, trivy-action, sonarqube-scan-action...
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      acciones:
        patterns: ["*"]

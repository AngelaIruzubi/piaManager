# Configuración del análisis de SonarQube Cloud (lo lanza el CI: job "sonarqube" en .github/workflows/ci.yml)

# Quién: organización y proyecto en SonarQube Cloud
sonar.organization=angelairuzubi
sonar.projectKey=AngelaIruzubi_piaManager
sonar.projectName=piaManager

# Qué es código
sonar.sources=backend/src,frontend/src
sonar.sourceEncoding=UTF-8

# Qué son tests: se analizan aparte y no cuentan como código
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Qué no se analiza: los propios tests (ya están en sonar.tests) y las migraciones, que genera TypeORM
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/migrations/**

# Cobertura: informe lcov que genera Jest en el backend (npm run test:coverage)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# De momento la cobertura solo se mide en el backend: el frontend aún no tiene tests (Fase 3).
# También se excluye lo que Jest no mide (arranque, configuración, entidades y migraciones)
sonar.coverage.exclusions=frontend/**,backend/src/index.ts,backend/src/config/**,backend/src/entities/**,backend/src/migrations/**

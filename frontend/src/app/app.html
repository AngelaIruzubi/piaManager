<ng-container *ngIf="estaAutenticado(); else soloContenido">
  <nav class="navbar">
    <div class="navbar-brand">
      <span class="navbar-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-9.5-9C1 8 2.5 5 5.5 5c2 0 3.5 1.3 4.5 3 1-1.7 2.5-3 4.5-3 3 0 4.5 3 3 7-2.5 4.6-9.5 9-9.5 9z"/></svg>
      </span>
      PIA Manager
    </div>
    <div class="navbar-info" *ngIf="usuario$ | async as usuario">
      {{ usuario.nombre }} — {{ usuario.rol }}
    </div>
    <button class="btn-logout" (click)="logout()">Cerrar sesión</button>
  </nav>

  <div class="layout">
    <aside class="sidebar">
      <a routerLink="/personas" routerLinkActive="activo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4.5-6 7-6s6 2 7 6"/></svg>
        Usuarios
      </a>
      <a routerLink="/usuarios" routerLinkActive="activo" *ngIf="esCoordinador()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2 20c0.7-3.2 3.4-5 7-5s6.3 1.8 7 5"/><path d="M16 4.5c1.7 0.4 3 1.9 3 3.5s-1.3 3.1-3 3.5"/><path d="M18 14.5c1.9 0.6 3.3 2 4 5.5"/></svg>
        Educadores
      </a>
    </aside>
    <main class="contenido">
      <router-outlet></router-outlet>
    </main>
  </div>
</ng-container>

<ng-template #soloContenido>
  <router-outlet></router-outlet>
</ng-template>

<div class="form-container">
  <button class="btn-volver" (click)="volver()">← Volver</button>

  <h2>{{ esEdicion ? 'Editar persona' : 'Nueva persona' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="fila">
      <div class="campo">
        <label for="persona-nombre">Nombre *</label>
        <input id="persona-nombre" type="text" formControlName="nombre" />
      </div>
      <div class="campo">
        <label for="persona-apellidos">Apellidos *</label>
        <input id="persona-apellidos" type="text" formControlName="apellidos" />
      </div>
    </div>

    <div class="fila">
      <div class="campo">
        <label for="persona-fecha-nacimiento">Fecha de nacimiento *</label>
        <input id="persona-fecha-nacimiento" type="date" formControlName="fecha_nacimiento" />
      </div>
      <div class="campo">
        <label for="persona-fecha-alta">Fecha de alta *</label>
        <input id="persona-fecha-alta" type="date" formControlName="fecha_alta" />
      </div>
    </div>

    <div class="fila">
      <div class="campo">
        <label for="persona-tutor">Tutor legal *</label>
        <input id="persona-tutor" type="text" formControlName="tutor_legal" />
      </div>
      <div class="campo">
        <label for="persona-telefono">Teléfono de contacto *</label>
        <input id="persona-telefono" type="text" formControlName="telefono_contacto" />
      </div>
    </div>

    <div class="campo">
      <label for="persona-educador">Educador de referencia *</label>
      <select id="persona-educador" formControlName="profesional_referencia_id">
        <option value="">Selecciona un educador</option>
        <option *ngFor="let educador of educadores" [value]="educador.id">
          {{ educador.nombre }} {{ educador.apellidos }}
        </option>
      </select>
    </div>

    <div class="error" *ngIf="error">{{ error }}</div>

    <div class="acciones">
      <button type="button" class="btn-cancelar" (click)="volver()">Cancelar</button>
      <button type="submit" class="btn-guardar" [disabled]="form.invalid || cargando">
        {{ cargando ? 'Guardando...' : esEdicion ? 'Guardar cambios' : 'Crear persona' }}
      </button>
    </div>
  </form>
</div>

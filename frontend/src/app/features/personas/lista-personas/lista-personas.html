<div class="lista-container">
  <div class="cabecera">
    <div>
      <h1>Usuarios</h1>
      <p class="subtitulo">Elige una persona para ver su plan de atención</p>
    </div>
    <button class="btn-nuevo" *ngIf="esCoordinador" routerLink="/personas/nueva">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="white"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 5v14" />
        <path d="M5 12h14" />
      </svg>
      Nuevo usuario
    </button>
  </div>

  <div *ngIf="cargando" class="cargando">Cargando...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div *ngIf="!cargando && !error">
    <div *ngIf="personas.length === 0" class="vacio">No hay personas registradas.</div>

    <div class="grid-tarjetas" *ngIf="personas.length > 0">
      <div class="tarjeta-persona" *ngFor="let persona of personas" (click)="verFicha(persona.id)">
        <div class="avatar">{{ iniciales(persona) }}</div>
        <div class="datos">
          <span class="nombre">{{ nombreCompleto(persona) }}</span>
          <div class="educador">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="8" r="3.5" />
              <path d="M5 20c1-4 4.5-6 7-6s6 2 7 6" />
            </svg>
            Educador: {{ persona.profesional_referencia?.nombre }}
            {{ persona.profesional_referencia?.apellidos }}
          </div>
          <app-estado-activo [activo]="persona.activo" />
        </div>
      </div>
    </div>
  </div>
</div>

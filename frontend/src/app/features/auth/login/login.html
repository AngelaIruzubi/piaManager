<div class="login-container">
  <div class="login-card">
    <h1>PIA Manager</h1>
    <p>Centro de día — Panel de gestión</p>

    <div class="aviso" role="status" *ngIf="aviso">{{ aviso }}</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="campo">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" formControlName="email" />
        <span class="error" *ngIf="emailControl?.invalid && emailControl?.touched">
          Email no válido
        </span>
      </div>

      <div class="campo">
        <label for="login-password">Contraseña</label>
        <input id="login-password" type="password" formControlName="password" />
        <span class="error" *ngIf="passwordControl?.invalid && passwordControl?.touched">
          Mínimo 6 caracteres
        </span>
      </div>

      <div class="error-general" *ngIf="error">{{ error }}</div>

      <button type="submit" [disabled]="form.invalid || cargando">
        {{ cargando ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>

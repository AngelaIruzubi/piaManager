<div class="form-container">
  <button class="btn-volver" (click)="volver()">← Volver</button>

  <h2>Nuevo PAI</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="fila">
      <div class="campo">
        <label for="pai-anio">Año *</label>
        <input id="pai-anio" type="number" formControlName="anio" />
      </div>
      <div class="campo">
        <label for="pai-fecha-inicio">Fecha de inicio *</label>
        <input id="pai-fecha-inicio" type="date" formControlName="fecha_inicio" />
      </div>
    </div>

    <div class="campo">
      <label for="pai-fecha-revision">Fecha de revisión</label>
      <input id="pai-fecha-revision" type="date" formControlName="fecha_revision" />
    </div>

    <div class="campo">
      <label for="pai-observaciones">Observaciones generales</label>
      <textarea
        id="pai-observaciones"
        formControlName="observaciones_generales"
        rows="4"
      ></textarea>
    </div>

    <div class="error" *ngIf="error">{{ error }}</div>

    <div class="acciones">
      <button type="button" class="btn-cancelar" (click)="volver()">Cancelar</button>
      <button type="submit" class="btn-guardar" [disabled]="form.invalid || cargando">
        {{ cargando ? 'Creando...' : 'Crear PAI' }}
      </button>
    </div>
  </form>
</div>

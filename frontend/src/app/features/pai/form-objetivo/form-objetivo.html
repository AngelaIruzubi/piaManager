<div class="form-container">

  <button class="btn-volver" (click)="volver()">← Volver</button>

  <h2>{{ esEdicion ? 'Editar objetivo' : 'Nuevo objetivo' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="campo">
      <label for="objetivo-descripcion">Descripción *</label>
      <textarea id="objetivo-descripcion" formControlName="descripcion" rows="3"
        placeholder="Ej: Se viste sola con supervisión mínima"></textarea>
    </div>

    <div class="fila">
      <div class="campo">
        <label for="objetivo-plazo">Plazo *</label>
        <select id="objetivo-plazo" formControlName="plazo">
          <option *ngFor="let p of plazos" [value]="p">
            {{ p | titlecase }}
          </option>
        </select>
      </div>
      <div class="campo">
        <label for="objetivo-fecha-prevista">Fecha prevista</label>
        <input id="objetivo-fecha-prevista" type="date" formControlName="fecha_prevista" />
      </div>
    </div>

    <div class="campo">
      <label for="objetivo-fecha-inicio">Fecha de inicio</label>
      <input id="objetivo-fecha-inicio" type="date" formControlName="fecha_inicio" />
    </div>

    <div class="error" *ngIf="error">{{ error }}</div>

    <div class="acciones">
      <button type="button" class="btn-cancelar" (click)="volver()">Cancelar</button>
      <button type="submit" class="btn-guardar" [disabled]="form.invalid || cargando">
        {{ cargando ? 'Guardando...' : (esEdicion ? 'Guardar cambios' : 'Crear objetivo') }}
      </button>
    </div>

  </form>
</div>

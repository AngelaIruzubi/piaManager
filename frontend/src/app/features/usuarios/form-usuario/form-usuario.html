<div class="form-container">

  <button class="btn-volver" (click)="volver()">← Volver</button>

  <h2>{{ esEdicion ? 'Editar educador' : 'Nuevo usuario' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="fila">
      <div class="campo">
        <label for="usuario-nombre">Nombre *</label>
        <input id="usuario-nombre" type="text" formControlName="nombre" />
      </div>
      <div class="campo">
        <label for="usuario-apellidos">Apellidos *</label>
        <input id="usuario-apellidos" type="text" formControlName="apellidos" />
      </div>
    </div>

    <div class="campo">
      <label for="usuario-email">Email *</label>
      <input id="usuario-email" type="email" formControlName="email" />
    </div>

    <div class="campo" *ngIf="!esEdicion">
      <label for="usuario-password">Contraseña *</label>
      <input id="usuario-password" type="password" formControlName="password" />
      <small>Mínimo 6 caracteres</small>
    </div>

    <div class="error" *ngIf="error">{{ error }}</div>

    <div class="acciones">
      <button type="button" class="btn-cancelar" (click)="volver()">Cancelar</button>
      <button type="submit" class="btn-guardar" [disabled]="form.invalid || cargando">
        {{ cargando ? 'Guardando...' : (esEdicion ? 'Guardar cambios' : 'Crear usuario') }}
      </button>
    </div>

  </form>
</div>

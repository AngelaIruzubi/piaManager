<div class="lista-container pagina">
  <div class="cabecera-pagina">
    <h2 class="titulo-pagina">Educadores</h2>
    <button class="btn-nuevo" routerLink="/usuarios/nuevo">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="white"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 5v14" />
        <path d="M5 12h14" />
      </svg>
      Nuevo educador
    </button>
  </div>

  <div *ngIf="cargando" class="cargando">Cargando...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div class="tabla-container" *ngIf="!cargando && !error">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuarios" (click)="verFicha(usuario.id)">
          <td>{{ usuario.nombre }} {{ usuario.apellidos }}</td>
          <td>{{ usuario.email }}</td>
          <td>
            <span class="badge-rol" [class.coordinador]="usuario.rol === 'coordinador'">
              {{ usuario.rol }}
            </span>
          </td>
          <td>
            <app-estado-activo [activo]="usuario.activo" />
          </td>
          <td>
            <button class="btn-baja" *ngIf="usuario.activo" (click)="darDeBaja(usuario.id, $event)">
              Dar de baja
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

# nginx sirve la app de Angular y hace de proxy inverso: /api va al backend.
# Así el navegador solo habla con un origen (sin problemas de CORS) y el backend no se expone directamente.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad básicas para todas las respuestas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Comprimir lo que viaja al navegador
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interno de Docker: el nombre "backend" se resuelve al hacer cada petición,
    # así nginx arranca aunque el backend todavía no esté listo
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API: se pasa tal cual al contenedor del backend
    location /api/ {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JS y CSS de Angular llevan un código en el nombre que cambia en cada versión:
    # se pueden guardar en caché un año sin riesgo
    location ~* "-[a-z0-9]{8,}\.(js|css)$" {
        expires 1y;
        try_files $uri =404;
    }

    # Rutas de Angular (/personas/1, /login...): si no es un archivo, se entrega index.html
    # y Angular muestra la pantalla. index.html nunca se cachea, para coger siempre la última versión
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
